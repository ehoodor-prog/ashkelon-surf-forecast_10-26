name: Ashkelon Surf Forecast

on:
  workflow_dispatch:

  schedule:
    - cron: "0 20 * * *"
      timezone: "Asia/Jerusalem"

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install copernicusmarine xarray pandas netCDF4

      - name: Run Ashkelon forecast script
        run: |
          python ashkelon_swell.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ashkelon.json
          git diff --cached --quiet || git commit -m "Update Ashkelon surf forecast"
          git push
